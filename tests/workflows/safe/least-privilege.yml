# 정상 예제: 최소 권한 명시 + 커밋 SHA 로 고정된 Action
name: Safe Least Privilege

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: echo "building ${{ github.sha }}"
